{% extends "base.html" %}
{% block title %}Cari Paket · myengsel{% endblock %}
{% block content %}

<div class="max-w-md mx-auto my-4 px-1">
  
  <div class="flex bg-slate-50 p-1.5 rounded-2xl mb-6 border border-slate-100">
    <a href="/packages/by-option" class="flex-1 text-center py-2.5 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all active:scale-[0.98] {% if mode == 'option' %}bg-white text-black shadow-sm border border-slate-100{% else %}text-slate-400 hover:text-black{% endif %}">
      Option Code
    </a>
    <a href="/packages/by-family" class="flex-1 text-center py-2.5 text-[10px] font-black uppercase tracking-widest rounded-xl transition-all active:scale-[0.98] {% if mode == 'family' %}bg-white text-black shadow-sm border border-slate-100{% else %}text-slate-400 hover:text-black{% endif %}">
      Family Code
    </a>
  </div>

  <div class="bg-white border border-slate-100 rounded-[28px] p-8 shadow-sm">
    <div class="mb-8 text-center">
      <h1 class="text-lg font-black tracking-tight text-black flex items-center justify-center gap-2">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        Cari Paket
      </h1>
      <p class="text-[11px] text-slate-400 mt-1 font-medium">Masukkan kode untuk melihat detail kuota.</p>
    </div>

    <form method="get" action="/packages/by-{{ 'option' if mode == 'option' else 'family' }}" class="space-y-4">
      <div>
        <label class="block text-[9px] font-black text-slate-400 uppercase tracking-widest mb-2 pl-1">
          {{ "Option Code" if mode == "option" else "Family Code" }}
        </label>
        
        <div class="relative flex items-center">
          <input class="w-full bg-slate-50 border border-slate-100 rounded-2xl pl-4 pr-12 py-4 text-[11px] font-mono font-bold text-black uppercase placeholder-slate-300 tracking-widest focus:outline-none focus:border-black transition-all" 
                 type="text" 
                 name="code" 
                 placeholder="Contoh: {{ 'OP_123X' if mode == 'option' else 'FAM_999Z' }}"
                 required 
                 autocomplete="off">
          <svg class="absolute right-4 w-4 h-4 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/>
          </svg>
        </div>
      </div>

      <button class="w-full bg-black hover:bg-slate-800 text-white py-4 rounded-2xl text-[11px] font-black uppercase tracking-widest transition-all active:scale-[0.98]" 
              type="submit">
        Mulai Pencarian
      </button>
    </form>
  </div>

</div>

<div class="pb-24"></div>

{% endblock %}
