{% extends "base.html" %}
{% block title %}{{ title }} · myengsel{% endblock %}
{% block content %}

<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 pl-1">
  <div>
    <h1 class="text-xl font-black tracking-tight text-slate-900">{{ title }}</h1>
    <p class="text-xs text-slate-400 mt-0.5">Detail respons data mentah dari sistem API.</p>
  </div>
  
  <form method="get" class="shrink-0">
    <label class="relative inline-flex items-center gap-3 bg-slate-50 border border-slate-200 px-3.5 py-2 rounded-2xl cursor-pointer select-none transition-all hover:border-slate-300">
      <input type="checkbox" name="enterprise" value="true" {% if enterprise %}checked{% endif %} onchange="this.form.submit()" class="sr-only peer">
      <div class="w-8 h-4.5 bg-slate-200 rounded-full relative transition-colors duration-200 peer-checked:bg-slate-900 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3.5 after:w-3.5 after:transition-all peer-checked:after:translate-x-3.5 shadow-inner"></div>
      <span class="text-xs font-black tracking-wide text-slate-500 peer-checked:text-slate-900">Enterprise Mode</span>
    </label>
  </form>
</div>

<div class="bg-white border border-slate-200/80 rounded-[24px] p-5 shadow-[0_4px_24px_rgba(0,0,0,0.02)]">
  <div class="text-[10px] font-black tracking-wider text-slate-400 uppercase mb-2.5 pl-1">Raw API Response</div>
  
  <div class="bg-slate-50 border border-slate-200/60 rounded-xl p-4 shadow-inner">
    <pre class="text-xs font-mono text-slate-600 overflow-x-auto leading-relaxed selection:bg-slate-900 selection:text-white">{{ res | tojson(indent=2) }}</pre>
  </div>
</div>

<div class="pb-24"></div>

{% endblock %}
