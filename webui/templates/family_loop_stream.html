{% extends "base.html" %}
{% block title %}Loop Berjalan · myengsel{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-8">
  <div class="mb-8">
    <h1 class="text-2xl font-black text-slate-900 tracking-tight flex items-center gap-3">
      <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Status Loop
    </h1>
    <div class="flex items-center gap-4 mt-3 text-[10px] font-black text-slate-400 uppercase tracking-widest">
      <span class="flex items-center gap-1.5"><svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> {{ family_code }}</span>
      <span>•</span>
      <span>#{{ start_from }}</span>
      <span>•</span>
      <span>{{ delay_seconds }}s</span>
    </div>
  </div>

  <div class="bg-white border border-slate-100 rounded-[32px] p-8 mb-6 shadow-[0_20px_50px_rgba(0,0,0,0.04)]">
    <div class="flex items-center justify-between mb-8">
      <div id="status-text" class="text-sm font-bold text-slate-900">Inisialisasi...</div>
      <div id="status-pill" class="text-[9px] font-black uppercase tracking-widest px-3 py-1 rounded-full bg-slate-100 text-slate-500">Running</div>
    </div>

    <div class="space-y-3 mb-8">
      <div class="flex justify-between text-[10px] font-black text-slate-400 uppercase tracking-widest">
        <span>Progress</span>
        <span id="seq-pct">0%</span>
      </div>
      <div class="h-2 bg-slate-100 rounded-full overflow-hidden">
        <div id="progress-bar" class="h-full bg-slate-900 transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-3">
      <div class="bg-slate-50 rounded-2xl p-4 text-center">
        <div class="text-lg font-black text-slate-900" id="cnt-ok">0</div>
        <div class="text-[9px] text-slate-400 font-black uppercase tracking-widest mt-1">Sukses</div>
      </div>
      <div class="bg-slate-50 rounded-2xl p-4 text-center">
        <div class="text-lg font-black text-slate-900" id="cnt-fail">0</div>
        <div class="text-[9px] text-slate-400 font-black uppercase tracking-widest mt-1">Gagal</div>
      </div>
      <div class="bg-slate-50 rounded-2xl p-4 text-center">
        <div class="text-lg font-black text-slate-900" id="cnt-err">0</div>
        <div class="text-[9px] text-slate-400 font-black uppercase tracking-widest mt-1">Error</div>
      </div>
    </div>

    <div id="current-box" class="mt-8 hidden">
      <div class="bg-slate-900 rounded-2xl p-5 text-white">
        <div class="text-[9px] font-black text-slate-500 uppercase tracking-widest mb-1.5">Sedang Diproses</div>
        <div id="cur-title" class="font-bold text-sm"></div>
        <div id="cur-step" class="text-[10px] text-slate-400 mt-1 font-mono"></div>
      </div>
    </div>
  </div>

  <div class="flex gap-3 mb-8">
    <button id="btn-stop" class="flex-1 py-4 rounded-2xl bg-white border border-slate-200 text-slate-900 font-bold text-xs hover:bg-slate-50 transition-all hidden">Stop Loop</button>
    <a class="flex-1 text-center py-4 rounded-2xl bg-slate-900 text-white font-bold text-xs" href="/">Beranda</a>
    <a id="btn-retry" class="flex-1 text-center py-4 rounded-2xl bg-slate-100 text-slate-900 font-bold text-xs hidden" href="javascript:location.reload()">Ulangi</a>
  </div>

  <div class="bg-white border border-slate-100 rounded-[32px] p-8 shadow-[0_20px_50px_rgba(0,0,0,0.04)]">
    <div class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Detail Log</div>
    <div id="log" class="font-mono text-[10px] space-y-2 h-40 overflow-y-auto text-slate-500 p-2"></div>
  </div>
</div>

<script>
  // Logic JavaScript tetap sama agar fungsionalitas terjaga
  (function(){
    const $ = id => document.getElementById(id);
    const log = $('log'), statusText = $('status-text'), statusPill = $('status-pill'),
          seqPct = $('seq-pct'), bar = $('progress-bar'),
          cntOk = $('cnt-ok'), cntFail = $('cnt-fail'), cntErr = $('cnt-err'),
          curBox = $('current-box'), curTitle = $('cur-title'), curStep = $('cur-step'),
          btnStop = $('btn-stop'), btnRetry = $('btn-retry');
    let total = 0;

    function add(line, color){
      const div = document.createElement('div');
      div.textContent = line;
      if (color) div.style.color = color;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }
    
    function updateSummary(s){
      if (!s) return;
      if ('ok' in s) cntOk.textContent = s.ok;
      if ('fail' in s) cntFail.textContent = s.fail;
      if ('err' in s) cntErr.textContent = s.err;
    }

    const url = `/purchase/family-loop/stream?family_code={{ family_code | urlencode }}&start_from={{ start_from }}&delay_seconds={{ delay_seconds }}&use_decoy={{ 'true' if use_decoy else 'false' }}`;
    const es = new EventSource(url);
    
    btnStop.classList.remove('hidden');
    btnStop.addEventListener('click', () => {
      es.close();
      statusText.textContent = 'Dihentikan';
      statusPill.textContent = 'Stopped';
      btnStop.classList.add('hidden'); btnRetry.classList.remove('hidden');
      curBox.classList.add('hidden');
    });

    es.addEventListener('progress', e => {
      const d = JSON.parse(e.data);
      if (d.total) total = d.total;
      if (d.seq) {
          const pct = Math.min(100, Math.round(d.seq / (total || 1) * 100));
          seqPct.textContent = pct + '%';
          bar.style.width = pct + '%';
      }
      if (d.step === 'start') {
        curBox.classList.remove('hidden');
        curTitle.textContent = `#${d.seq} · ${d.option}`;
        curStep.textContent = 'Memulai...';
      } else if (curStep) {
        curStep.textContent = d.msg.replace(/^\s*↳\s*/, '');
      }
      add(d.msg);
    });

    es.addEventListener('success', e => { const d = JSON.parse(e.data); updateSummary(d.summary); add(d.msg, '#10b981'); });
    es.addEventListener('fail', e => { const d = JSON.parse(e.data); updateSummary(d.summary); add(d.msg, '#f59e0b'); });
    es.addEventListener('error', e => { 
        statusPill.textContent = 'Error'; 
        es.close(); btnStop.classList.add('hidden'); btnRetry.classList.remove('hidden'); 
    });
    es.addEventListener('done', e => { 
        statusPill.textContent = 'Done'; 
        btnStop.classList.add('hidden'); btnRetry.classList.remove('hidden');
        es.close(); 
    });
  })();
</script>
{% endblock %}
